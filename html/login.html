<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LoyzDev Portofolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Cloudflare Turnstile API Script -->
    <script src="../js/error-watch.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar">
        <div class="logo">Loyz<span>Dev</span></div>
        <div class="hamburger" id="hamburger-btn">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <ul class="nav-links">
            <li><a href="../index">Beranda</a></li>
            <li><a href="source">Source & Tools</a></li>
            <li><a href="login" class="active">Login</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <!-- Ditampilkan kalau user SUDAH login -->
        <div class="login-card" id="profile-card" style="display: none;">
            <img id="profile-avatar" class="profile-avatar" src="" alt="Foto profil">
            <h2 id="profile-name">-</h2>
            <p id="profile-email">-</p>
            <button class="oauth-btn" id="btn-logout">Logout</button>
        </div>

        <!-- Ditampilkan kalau user BELUM login -->
        <div class="login-card" id="login-card">
            <h2>Akses Akun</h2>
            <p>Silakan login untuk menyimpan konfigurasi Anda.</p>
            
            <!-- Wadah untuk widget Cloudflare Turnstile -->
            <div id="turnstile-container" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>

            <button class="oauth-btn github-btn" id="btn-login-github">Login dengan GitHub</button>
            <button class="oauth-btn google-btn" id="btn-login-google">Login dengan Google</button>
        </div>
    </main>

    <!-- Library Supabase JS (wajib dimuat sebelum config.js/auth.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Urutan pemanggilan script sangat penting: config -> script utama -> auth -> particles -->
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/particles.js"></script>
</body>
</html>
